wrapperVersion=3.3.4
distributionType=only-script
# 必须是「真实版本号」的完整路径。历史值 .../apache-maven/3/apache-maven-3-bin.zip
# 是无效 URL（版本段写成字面量 3），会让 ./mvnw 下载失败，并只在
# ~/.m2/wrapper/dists 下留下 apache-maven-3 / apache-maven-3-bin 两个空目录。
# Java 23 需要 Maven 3.9.x 及以上。
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip

