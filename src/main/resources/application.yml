# 修仙世界服务器配置
# 修改后重启生效；生产环境请修改密钥、密码等敏感配置。
# OneBot/Minecraft 适配器的实际运行参数由 config/adapters.json 控制。

# ┌──────────────────────────────────────────────────────────────┐
# │ 1. 应用信息                                                   │
# └──────────────────────────────────────────────────────────────┘
app:
  name: 修仙世界              # 应用显示名称（用于 OAuth 授权页等前端展示）


# ┌──────────────────────────────────────────────────────────────┐
# │ 2. HTTP 服务器                                                │
# └──────────────────────────────────────────────────────────────┘
server:
  host: 127.0.0.1             # 监听地址（0.0.0.0 对外网开放，127.0.0.1 仅本机）
  port: 8080                  # HTTP 服务端口（管理后台 /api/admin、REST 接口）


# ┌──────────────────────────────────────────────────────────────┐
# │ 3. 数据库                                                     │
# └──────────────────────────────────────────────────────────────┘
database:
  type: sqlite                 # 数据库类型：sqlite（零依赖，推荐单机）| mysql
  url: jdbc:mysql://localhost:3306/xiuxian?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
                               # MySQL 连接串（仅 type=mysql 时使用）
  username: root               # MySQL 用户名（仅 type=mysql 时使用）
  password: root               # MySQL 密码（仅 type=mysql 时使用）
  sqlite_path: xiuxian.db      # SQLite 数据库文件路径（仅 type=sqlite 时使用）
  pool_max: 4                  # 连接池最大连接数（SQLite 建议 2~8，MySQL 建议 8~32）


# ┌──────────────────────────────────────────────────────────────┐
# │ 4. JWT 签名密钥                                               │
# └──────────────────────────────────────────────────────────────┘
jwt:
  secret: ""                   # 玩家 Token 签名密钥。
  # 留空 = 每次启动随机生成（重启后所有玩家 Token 失效，需重新登录）。
  # 生产环境请设为至少 256 位随机串，生成方式：openssl rand -base64 48


# ┌──────────────────────────────────────────────────────────────┐
# │ 5. 全局季节系统                                               │
# └──────────────────────────────────────────────────────────────┘
season:
  mode: calendar               # 更替模式：calendar=按真实月份四季；cycle=按小时循环
  cycle_hours: 6               # cycle 模式下每季持续小时数（更替时全服广播）


# ┌──────────────────────────────────────────────────────────────┐
# │ 6. OAuth2 支持（独立鉴权端点，不与其他业务系统集成）           │
# └──────────────────────────────────────────────────────────────┘
oauth2:
  enabled: true                # 是否启用 OAuth2 授权端点
  client_id: xiuxian_oauth_client        # 客户端 ID
  client_secret: xiuxian_oauth_secret_please_change   # 客户端密钥（务必修改）
  scopes: read write           # 授权作用域（空格分隔）
  token_ttl_seconds: 3600      # Access Token 有效时长（秒）


# ┌──────────────────────────────────────────────────────────────┐
# │ 7. 玩家数据文件化（一用户一个 JSON 文件）                      │
# └──────────────────────────────────────────────────────────────┘
player-data:
  enabled: true                # 是否启用玩家数据文件化落盘
  dir: data/players            # 数据文件存放目录
  auto-sync-seconds: 30        # 变更数据定期落盘间隔（秒），0 关闭自动同步
  self-restore: false          # 是否允许玩家用导出文件自助恢复（默认关闭，防刷）


# ┌──────────────────────────────────────────────────────────────┐
# │ 8. 安装向导（/install）                                       │
# └──────────────────────────────────────────────────────────────┘
install:
  # 安装向导的写操作（POST /api/install/configure、/reset、/restart）默认
  # 只接受来自本机回环地址（127.0.0.1 / ::1 / localhost）的请求，其余来源
  # 一律返回 403。目的是消除「服务器已暴露在网络上、但尚未完成安装」这个
  # 高危窗口 —— 那时还没有管理员密码，向导可以改写数据库连接串、管理员
  # 账号和 JWT 密钥，等同于交出整台服务器。
  #
  # 需要远程 / 局域网 / Docker 安装时改为 true，并自行确认网络边界安全。
  # 安装成功后 config/.installed 锁文件会关闭 /configure，开放窗口自动消失。
  #
  #   • Docker：宿主机浏览器访问映射端口时，容器内看到的来源是 Docker 网关
  #     IP 而非回环地址，必须打开本开关才能完成安装；
  #   • 反向代理：来源会变成代理地址，只有代理与服务器同机（走回环）才免开；
  #     代码不读取 X-Forwarded-For，因此跨机反代同样需要打开本开关；
  #   • 同一台机器用局域网 IP 访问（如 192.168.1.10:8080）同样会被拦，
  #     改用 127.0.0.1 即可，无需打开本开关。
  #
  # GET /api/install/status 不受本开关影响（始终可访问，仅用于展示环境信息）。
  allow_remote: false


# ┌──────────────────────────────────────────────────────────────┐
# │ 9. 管理后台                                                   │
# └──────────────────────────────────────────────────────────────┘
admin:
  username: admin              # 管理后台账号
  password_hash: $2a$10$njJJacGfGPEX1FHD6MB1HeKEgjfWx5zF2nrGo.gEbdjb3Q.KA3gcC
                               # 管理后台密码的 bcrypt 哈希（本值为默认密码 admin123 的哈希）
                               # ⚠ 请勿再配置明文 admin.password：首次启动会被自动哈希为
                               # admin.password_hash 并清除明文、重写本文件（注释会丢失）。
                               # 修改密码请重新运行安装向导；生产环境务必更换此哈希！


# ┌──────────────────────────────────────────────────────────────┐
# │ 10. 邮件 SMTP（用于注册验证码发送）                           │
# └──────────────────────────────────────────────────────────────┘
smtp:
  host: smtp.qq.com            # SMTP 服务器地址
  port: 587                    # SMTP 端口（587=STARTTLS，465=SSL）
  username: ""                 # SMTP 登录账号（通常为发件邮箱地址）
  password: ""                 # SMTP 授权码（非邮箱登录密码）
  from: ""                     # 发件人地址（留空则使用 username）
  auth: true                   # 是否启用 SMTP 认证
  starttls: true               # 是否启用 STARTTLS 加密


# ┌──────────────────────────────────────────────────────────────┐
# │ 11. 注册邮箱验证码                                            │
# └──────────────────────────────────────────────────────────────┘
verify_code:
  enabled: true                # 是否要求注册时通过邮箱验证码
  allowed_domains:             # 允许注册的邮箱域名（列表，逗号分隔读取）
    - qq.com
    - 163.com
    - 126.com
    - gmail.com
    - outlook.com
    - hotmail.com
  rate_limit_seconds: 60       # 同一邮箱发送验证码的冷却时间（秒）


# ┌──────────────────────────────────────────────────────────────┐
# │ 12. OneBot QQ 机器人                                          │
# └──────────────────────────────────────────────────────────────┘
onebot:
  enabled: true                # 是否启用 OneBot 接入
  send_mode: text              # 消息发送模式：text=纯文本；其他可选（截图等）
  screenshot:
    window_title: ""           # 截图目标窗口标题（留空自动识别）
    poll_interval: 2000        # 截图轮询间隔（毫秒）


# ┌──────────────────────────────────────────────────────────────┐
# │ 13. Minecraft 内置服务器适配                                   │
# └──────────────────────────────────────────────────────────────┘
minecraft:
  jar_path: ""                 # 服务端 jar 包路径（内置 MC 服务器用）
  server_dir: mc_server        # 服务端工作目录
  java_path: java              # Java 可执行路径
  min_memory_mb: 512           # JVM 最小堆内存（MB）
  max_memory_mb: 1024          # JVM 最大堆内存（MB）
  ready_timeout_seconds: 120   # 等待服务就绪超时（秒）
  extra_jvm_args: ""           # 额外的 JVM 启动参数
  online_mode: false           # 是否正版验证（true=正版用户名，false=离线）
  command_prefix: "xiuxian"    # MC 内指令前缀


# ┌──────────────────────────────────────────────────────────────┐
# │ 14. 日志                                                      │
# └──────────────────────────────────────────────────────────────┘
logging:
  level: DEBUG                 # 日志级别：TRACE/DEBUG/INFO/WARN/ERROR
  dir: log                     # 日志文件输出目录
  color: true                  # 控制台日志是否着色


# ┌──────────────────────────────────────────────────────────────┐
# │ 15. 背包系统                                                  │
# └──────────────────────────────────────────────────────────────┘
inventory:
  base_capacity: 30            # 初始背包格子数
  capacity_per_level: 5        # 每升一级增加的背包格子数


# ┌──────────────────────────────────────────────────────────────┐
# │ 15a. 多语言（i18n）                                          │
# └──────────────────────────────────────────────────────────────┘
# 语言协商顺序（高→低）：?lang= > X-Lang > Accept-Language > 本项。
# 玩家在 players.lang 里存的个人偏好优先级高于本项，仅影响该玩家自己的回复。
#
# default-language 是"协商全部失败时的落点"，也是新玩家的初始语言。
# 改成 en_us 后，从未设置过语言的存量玩家会自动跟着变——
# players.lang 的迁移刻意回填空串而非 zh_cn，就是为了保住这个能力。
#
# 支持的语言见 com.mtxgdn.i18n.GameLanguage 枚举；填了枚举里没有的代码
# 会打一条 WARN 并回落 zh_cn，服务照常启动。
i18n:
  default-language: zh_cn      # zh_cn / en_us


# ┌──────────────────────────────────────────────────────────────┐
# │ 15b. 坊市（挂单时限 + 成交价格历史）                         │
# └──────────────────────────────────────────────────────────────┘
market:
  listing_duration_hours: 72   # 挂单有效时长（小时），到期自动下架并把物品退回卖家
  price_history_keep_days: 30  # 成交价格历史保留天数（超期由清理任务删除）
  price_history_cleanup_interval_hours: 6  # 价格历史清理任务执行间隔（小时）


# ┌──────────────────────────────────────────────────────────────┐
# │ 15c. Buff（过期回收）                                        │
# └──────────────────────────────────────────────────────────────┘
buff:
  # 过期增益「兜底」回收间隔（秒）。
  # 活跃玩家在访问 Buff 时即时过期，不依赖此任务；它只负责离线玩家
  # （加成物化在 players 表上，离线后没有触发点，属性会一直虚高）。
  # 原实现是每秒一次全表扫描，现已降为低频兜底，最小 10 秒。
  expire_sweep_seconds: 60


# ┌──────────────────────────────────────────────────────────────┐
# │ 15d. 宗门：宗主缺位继位 / 竞争期                              │
# └──────────────────────────────────────────────────────────────┘
# 解决"宗主弃坑 → 宗门永久死锁"：宗主可以主动 /宗门 退位，
# 系统按贡献自动选出继任者；继任者与最强竞争者实力接近时开启竞争期，
# 期内竞争者可通过三局两胜的争夺战抢班。
sect:
  # 宗主连续不活跃超过该天数即判定弃坑，自动触发按贡献继位。
  # 0 = 关闭该判定，只保留"主动退位"路径。
  # 判定依据 players.last_active_time（所有通道通用）；升级后老玩家该值为 0
  # （= 尚未观测到活跃），不会误判，从各自下一次登录开始计时。
  leader_absent_days: 14
  # 继位后开启的宗主竞争期天数（期内竞争者可发起争夺战；无人发起则现任继续担任）。
  contest_days: 7
  # 继任者与最强竞争者的"境界序位差"小于该值才开启竞争期。
  # 境界序位 = 大境界 * 3 + 小境界，因此 6 ≈ 两个大境界；差距过大时挑战无意义，直接坐稳。
  contest_level_gap: 6
  # 继位维护扫描间隔（秒），最小 30。只处理"不活跃宗主"与"到期竞争期"，
  # 主动退位是同步执行的，不依赖这个任务。
  succession_sweep_seconds: 600


# ┌──────────────────────────────────────────────────────────────┐
# │ 15e. 世界 Boss（全服共享血量 + 伤害分红）                      │
# └──────────────────────────────────────────────────────────────┘
# 与「个人 PVE Boss」「团队 Raid Boss」的区别：血量全服共享且直接落库，
# 没有内存态也没有定时器；奖励按伤害比例分红而不是击杀独占，
# 因此全服累计发放天然不超过预算（累计伤害不会超过最大血量）。
world_boss:
  # Boss 池的归属键。单世界服务器固定 global（全服共享同一批 Boss）；
  # 将来若要「按群/按分线」各有一批，改这里即可，不必改表结构。
  scope: global
  # 一个池子里放几只 Boss（1-10）。按序号切成低/中/高三档境界区间。
  boss_count: 3
  # 整池重建周期（小时）。到期由读取时的惰性判断触发重建，不需要定时任务。
  respawn_hours: 4
  # 血量倍率：相对同境界普通 Boss。世界 Boss 要经得起全服玩家轮流打。
  hp_multiplier: 12
  # 挑战境界门槛：玩家与 Boss 的「境界序位差」达到该值即不可挑战。
  # 境界序位 = 大境界 * 3 + 小境界，因此 9 ≈ 三个大境界。
  max_stage_gap: 9
  # 每人每只 Boss 的挑战冷却（秒）。本项目没有体力系统，若不限次，
  # 一个高境界玩家可以连着把 Boss 打死，其他人连参与的份都没有。0 = 不限制。
  challenge_cooldown_seconds: 300
  # 单次奖励熔断阈值。超过则改发「阈值 / (5 + rand(6))」。
  # 这不是日常路径（伤害分红已被预算限死），防的是配置事故被一次击杀放大成经济崩溃。
  max_single_reward: 1000000
  # 补最后一刀的人额外获得的修为比例（按 exp_budget 计算，同样受熔断约束）。
  kill_bonus_ratio: 0.2


# ┌──────────────────────────────────────────────────────────────┐
# │ 15f. 突破：连败增益（pity）+ 凝实（极境）                       │
# └──────────────────────────────────────────────────────────────┘
# 两件事都为了同一个目的：把「卡在瓶颈」从"纯运气劝退"变成"看得见进度的努力"。
breakthrough:
  # 每次渡劫失败累加的成功率（百分点）。失败次数存在 players.breakthrough_pity 里，
  # 存"次数"而不是"加成值"，调整这里之后老数据自动跟着变。成功后清零。
  # 注意：参照实现用的是"基础成功率的 20%"，但本项目高境界基础率只有 10%，
  # 那样要失败 40+ 次才见效 —— 因此改成固定百分点。
  pity_bonus: 20
  # 失败增益的堆叠上限（次数）。再往上也会被 95% 的成功率硬上限吃掉。
  max_pity_stack: 10
  # 凝实（极境淬体）：修为圆满时可以不去渡劫，改为压制修为淬体。
  # 每层降低的成功率百分点（按乘算打折，作用在各项加成汇总之后）。
  consolidate_rate_penalty: 10
  # 每层凝实提升的基础属性百分比（读取时乘算，见 PlayerService.getFinalAttack 等）。
  # 渡劫成功后层数清零，这部分加成一并消散 —— 极境之力化作了突破的踏脚石。
  consolidate_stat_bonus: 8
  # 凝实层数上限。
  consolidate_max_layers: 3
  # 凝实后渡劫失败的修为损失放大系数（每层 +30%）。
  consolidate_punish_bonus: 0.3


# ┌──────────────────────────────────────────────────────────────┐
# │ 16. 性能 / 线程池                                             │
# └──────────────────────────────────────────────────────────────┘
performance:
  low_memory: false            # 低内存模式（小内存机器开启，减少缓存占用）
  grizzly_io_threads: 2        # Grizzly IO 线程数
  grizzly_worker_cores: 4      # Grizzly 工作线程核心数
  grizzly_worker_max: 8        # Grizzly 工作线程最大数
  memory_log_entries: 200      # 内存中保留的日志条数上限


# ┌──────────────────────────────────────────────────────────────┐
# │ 17. 网络                                                      │
# └──────────────────────────────────────────────────────────────┘
network:
  connection_timeout_ms: 10000 # 连接建立超时（毫秒）
  read_timeout_ms: 30000       # 读取超时（毫秒）


# ┌──────────────────────────────────────────────────────────────┐
# │ 18. Minecraft MOTD 预览                                       │
# └──────────────────────────────────────────────────────────────┘
motd:
  port: 25565                  # MOTD 监听端口（显示服务器列表预览用）
  max_players: 2026            # 展示的最大玩家数
  version_name: "§b§l修仙世界 §r§f— §eAPI v1.0"   # 版本行文案
  protocol_version: -1         # 协议版本（-1=自动/未知）
  line1: "§b§l修 仙 世 界 §r§8— §e§lXiuXian Game"  # 第 1 行
  line2: "§7"                  # 第 2 行
  line3: "§f⚔ §a境界突破 §7| §d秘境探索 §7| §e游历修仙 §f⚔"  # 第 3 行
  # 玩家尝试加入（登录）时显示的消息；支持占位符：
  #   {username} 玩家名   {online} 当前在线   {max} 最大玩家
  #   {delay} 重定向秒数  {server} 目标服务器
  join_message: ""
  # 可选：玩家点"加入服务器"后的目标服务器（host 或 host:port）。
  # 配置后，任意版本的客户端都会通过 TCP 透传隧道"直接接入"目标服务器
  # （效果等同玩家直接连目标地址；不再走官方 transfer，也不会再出现
  #  multiplayer.disconnect.transfer 断开提示）。目标服务器上的 AuthMe 登录
  #  界面、正版/离线验证等流程照常进行；留空则不跳转，仅显示拒绝提示。
  # 注意：透传后目标服务器看到的是本服务所在机器的 IP（如同反代/跳板入口）。
  redirect_server: ""
  redirect_delay_seconds: 5    # 仅作为 join_message 中 {delay} 占位符的数值（跳转本身是即时的）


# ┌──────────────────────────────────────────────────────────────┐
# │ 19. 内置玩法模块                                               │
# └──────────────────────────────────────────────────────────────┘
# 内置插件/玩法模块的启停开关已迁移到独立配置文件 config/plugins.yml
# （根节点 plugins:，含玩法模块、实验性插件与消息通道适配器开关）。
# 也可在 WebUI「插件管理」页运行时启停，选择会持久化写入 config/plugins.yml。
# 旧版本写在下面的 built_in_plugins 段仅作为只读兜底：升级后首次启动会自动迁移，
# 未迁移到的键仍会读取，但一旦 plugins.yml 里存在同名键即以 plugins.yml 为准。


# ┌──────────────────────────────────────────────────────────────┐
# │ 20. 重启方式（安装向导 / QQ「/重启」）                        │
# └──────────────────────────────────────────────────────────────┘
# auto        = 自动判断：检测到 systemd（INVOCATION_ID）、容器（/.dockerenv 等）
#               时只退出，由托管方拉起；否则自己拉起新进程。
# supervised  = 强制"只退出"：systemd 单元需 Restart=always，容器需 restart 策略，
#               面板需开启自动重启；否则服务不会自己回来。
# self-spawn  = 强制自己拉起新进程：适合裸跑、或面板托管但没开自动重启的场景。
restart:
  mode: auto

