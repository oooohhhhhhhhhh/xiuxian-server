# ========================================
#  内置玩法模块配置
#  设为 false 可禁用对应模块（重启后生效）
#  未配置或设为 true 则默认启用
# ========================================

# 农场系统（种植、浇水、施肥、收获）
# farm: true

# 宗门系统（创建宗门、宗门管理、宗门仓库）
# sect: true

# 洞府系统（灵力收集、洞府升级）
# cave: true

# 坊市交易系统（上架、购买、取消）
# trade: true

# 探索/游历系统（游历事件、随机遭遇）
# exploration: true

# 秘境系统（进入秘境、秘境探索）
# secret_realm: true

# 聊天系统（世界频道、私聊）
# chat: true

# 好友系统（添加好友、好友列表）
# friend: true

# 团队系统（创建团队、副本）
# team: true

# 地图系统（移动、旅行）
# map: true

# 称号系统（成就、称号装备）
# title: true

# 功法系统（功法学习、装备、升级）
# technique: true

# 炼丹锻造系统（配方、炼制）
# crafting: true

# Buff系统（增益效果）
# buff: true

# 阵法系统（阵法加成）
# formation: true

# 能量系统（物品转化能量）
# energy: true
