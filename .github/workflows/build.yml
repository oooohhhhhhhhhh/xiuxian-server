name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  GITHUB_REPOSITORY_URL: https://maven.pkg.github.com/oooohhhhhhhhhh/xiuxian-server
  GIT_COMMIT_SHA: ${{ github.sha }}

jobs:
  # 测试门禁：以前这里没有 test 阶段，deploy 直接 -DskipTests 打包装车，
  # 346 个用例在任何一次合并里都不会被执行 —— 测试写了等于没写。
  # 现在打包必须先过测试，PR 也会跑（PR 只跑测试，不发布）。
  test:
    name: 测试门禁
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn -B test

      # 失败时把报告带出来，否则只能看到一句 "There are test failures"
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  build:
    name: 构建并发布
    needs: test
    # 只有推送到 main 才发布；PR 只做测试门禁
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          echo "<settings><servers><server><id>github</id><username>$GITHUB_ACTOR</username><password>$GITHUB_TOKEN</password></server></servers></settings>" > ~/.m2/settings.xml
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update version and deploy
        run: |
          BASE_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          NEW_VERSION="${BASE_VERSION%-SNAPSHOT}-$GIT_COMMIT_SHA"
          mvn versions:set -DnewVersion=$NEW_VERSION -DgenerateBackupPoms=false -B
          # -DskipTests 在这里是安全的：测试已在 needs 的 test 作业里跑过一遍，
          # 重复跑只会让发布多等两分钟。
          mvn clean deploy -DskipTests -B -P github

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-server-jar
          path: target/*.jar
